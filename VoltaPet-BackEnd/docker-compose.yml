name: voltapet-backend

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-voltapet}
      POSTGRES_USER: ${DB_USER:-voltapet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voltapet} -d ${DB_NAME:-voltapet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [voltapet_net]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-voltapet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [voltapet_net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-voltapet}
      DB_USER: ${DB_USER:-voltapet}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-voltapet-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voltapet}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [voltapet_net]

networks:
  voltapet_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
