name: voltapet

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: voltapet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-voltapet}
      POSTGRES_USER: ${DB_USER:-voltapet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - voltapet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voltapet} -d ${DB_NAME:-voltapet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voltapet-net

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: voltapet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-voltapet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - voltapet_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voltapet-net

  backend:
    build:
      context: ./VoltaPet-BackEnd
      dockerfile: Dockerfile
    container_name: voltapet-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-voltapet}
      DB_USER: ${DB_USER:-voltapet}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-voltapet-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voltapet}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            # Healthcheck de e-mail desabilitado no ambiente local
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - voltapet-net

  frontend:
    build:
      context: ./VoltaPet-FrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: voltapet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - voltapet-net

networks:
  voltapet-net:
    driver: bridge

volumes:
  voltapet_postgres_data:
  voltapet_minio_data:
